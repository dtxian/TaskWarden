[package]
name = "taskwarden"
version = "0.1.0"
description = "TaskWarden — 轻量级后台任务守护监督器"
authors = ["TaskWarden"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "taskwarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri 2 + 托盘（image-png：托盘图标从内嵌 PNG 字节构造）
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
# 单实例：多开时激活已有窗口
tauri-plugin-single-instance = "2"
# 原生文件选择对话框
tauri-plugin-dialog = "2"

# 序列化 / 配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
log = "0.4"

# Windows 原生 API（Job Object / 进程 / 系统信息）
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
] }

# GPU 采样（NVML，容错）
nvml-wrapper = "0.12"
