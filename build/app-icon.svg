<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C222C"/>
      <stop offset="0.55" stop-color="#101319"/>
      <stop offset="1" stop-color="#06080B"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A29" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF7A29" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="shieldLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC191"/>
      <stop offset="0.5" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#EF5C0A"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9557"/>
      <stop offset="1" stop-color="#FFD9B8"/>
    </linearGradient>
  </defs>

  <!-- 底板：深空渐变圆角方（Windows 11 会再做一次蒙版，保持安全边距） -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="34" y="34" width="956" height="956" rx="196" fill="none" stroke="#FF7A29" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 守护盾 -->
  <path d="M512 136 L794 246 V470 C794 654 676 792 512 862 C348 792 230 654 230 470 V246 Z"
        fill="url(#shieldFill)" stroke="url(#shieldLine)" stroke-width="44" stroke-linejoin="round"/>

  <!-- 生命体征脉冲（守护在线的心跳） -->
  <path d="M334 512 H438 L488 396 L556 596 L606 508 H702"
        fill="none" stroke="url(#pulse)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底座信号点 -->
  <circle cx="512" cy="742" r="24" fill="#FF7A29" fill-opacity="0.85"/>
</svg>
