name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: 前端 · typecheck + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  engine:
    name: 引擎 · cargo test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\bin
            engine\target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
      - run: cargo test --manifest-path engine/Cargo.toml
        env:
          CARGO_TERM_COLOR: always
